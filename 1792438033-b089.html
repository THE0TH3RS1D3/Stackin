<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack</title>
<style>
:root{color-scheme:dark;--bg:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const BASE=10,BH=1.6,C=.866,SN=.5,R=13,TOL=.35;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Helvetica Neue",Helvetica,Arial,sans-serif';
const COLS=['#ff3b1d','#1e90ff','#a020f0','#ffd400','#2ecc40','#00aaff'];
let W,H,S,DPR,TOP=0;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(W*.036,H*.02);
}
addEventListener('resize',resize);resize();

function store(k,v){try{if(v===undefined)return +localStorage.getItem(k)||0;localStorage.setItem(k,v)}catch(e){return 0}}
let best=store('stack_best'),diam=store('stack_diam');
let layers,cur,fall,parts=[],fx,score,state,camY=BH,combo,axis,dir,p,overT,pop=0;

const P=(x,y,z)=>[W/2+(x-z)*C*S,H*.6+(x+z)*SN*S-(y-camY)*S];
const col=(i,l=62)=>`hsl(${(40+i*4)%360},65%,${l}%)`;
const speed=()=>Math.min(9+score*.15,22);

function reset(){layers=[{x:0,z:0,w:BASE,d:BASE,y:0,i:0}];fall=[];fx=[];score=0;combo=0;cur=null;state='menu';}
function spawn(){
  const t=layers[layers.length-1];
  axis=layers.length%2;dir=Math.random()<.5?1:-1;p=-dir*R;
  cur={x:t.x,z:t.z,w:t.w,d:t.d,y:t.y+BH,i:layers.length};
  cur[axis?'z':'x']=t[axis?'z':'x']+p;
}
function burst(n){
  for(let k=0;k<n;k++)parts.push({x:Math.random()*W,y:H*(.05+Math.random()*.7),vx:(Math.random()-.5)*30,vy:-15+Math.random()*30,s:4+Math.random()*6,c:COLS[Math.random()*COLS.length|0],life:1.8});
}
function place(){
  const t=layers[layers.length-1],c=axis?'z':'x',s=axis?'d':'w';
  const delta=cur[c]-t[c],ad=Math.abs(delta),sg=Math.sign(delta)||1;
  if(ad>=t[s]){
    fall.push({...cur,vy:0,a:1,vc:sg*3});cur=null;state='over';overT=0;
    best=Math.max(best,score);store('stack_best',best);return;
  }
  const nb={...cur};
  if(ad<=TOL){
    nb[c]=t[c];combo++;
    if(combo>=6&&nb[s]<BASE)nb[s]=Math.min(BASE,nb[s]+.8);
    if(combo%5===0){diam++;store('stack_diam',diam);pop=1}
    fx.push({x:nb.x,z:nb.z,w:nb.w,d:nb.d,y:nb.y+BH,t:0});
    burst(14);
  }else{
    combo=0;nb[s]=t[s]-ad;nb[c]=t[c]+delta/2;
    const h={...cur,vy:0,a:1,vc:sg*3};h[s]=ad;h[c]=cur[c]+sg*(t[s]/2-ad/2);fall.push(h);
    burst(5);
  }
  layers.push(nb);score++;spawn();
}
function tap(){
  if(state==='menu'){state='play';spawn()}
  else if(state==='over'){if(overT>.5){reset();state='play';spawn()}}
  else place();
}
addEventListener('pointerdown',e=>{e.preventDefault();tap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();tap()}});

function update(dt){
  if(state==='play'){
    p+=dir*speed()*dt;
    if(p>R){p=R;dir=-1}if(p<-R){p=-R;dir=1}
    const c=axis?'z':'x';cur[c]=layers[layers.length-1][c]+p;
  }
  if(state==='over')overT+=dt;
  const target=layers.length*BH-(state==='menu'?3:0);
  camY+=(target-camY)*Math.min(1,dt*6);
  const c2=axis?'z':'x';
  for(const f of fall){f.vy-=30*dt;f.y+=f.vy*dt;f[c2]+=f.vc*dt;f.a-=dt*.5}
  fall=fall.filter(f=>f.a>0&&f.y>camY-40);
  for(const f of fx)f.t+=dt;fx=fx.filter(f=>f.t<.7);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=25*dt;q.life-=dt}
  parts=parts.filter(q=>q.life>0);
  if(pop>0)pop-=dt;
}

function poly(pts){ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath()}
function box(b,al=1){
  const x0=b.x-b.w/2,x1=b.x+b.w/2,z0=b.z-b.d/2,z1=b.z+b.d/2,yb=b.y,yt=b.y+BH;
  ctx.globalAlpha=al;ctx.fillStyle='#000';ctx.strokeStyle=col(b.i);ctx.lineWidth=Math.max(1.5,S*.16);ctx.lineJoin='round';
  const faces=[
    [P(x1,yt,z0),P(x1,yt,z1),P(x1,yb,z1),P(x1,yb,z0)],
    [P(x0,yt,z1),P(x1,yt,z1),P(x1,yb,z1),P(x0,yb,z1)],
    [P(x0,yt,z0),P(x1,yt,z0),P(x1,yt,z1),P(x0,yt,z1)]];
  for(const f of faces){poly(f);ctx.fill();ctx.stroke()}
  ctx.globalAlpha=1;
}
function rect(f,grow,color,lw,al){
  const w=f.w+grow,d=f.d+grow,x0=f.x-w/2,x1=f.x+w/2,z0=f.z-d/2,z1=f.z+d/2;
  poly([P(x0,f.y,z0),P(x1,f.y,z0),P(x1,f.y,z1),P(x0,f.y,z1)]);
  ctx.globalAlpha=al;ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke();ctx.globalAlpha=1;
}
function diamond(x,y,r){ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r*.7,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r*.7,y);ctx.closePath();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
function pill(x,y,w,h){ctx.fillStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.roundRect(x,y,w,h,6);ctx.fill()}
function text(t,x,y,size,weight=200,align='center',alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle='#fff';ctx.font=`${weight} ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y);ctx.globalAlpha=1}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(const q of parts){ctx.globalAlpha=Math.min(1,q.life);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,q.s,q.s)}
  ctx.globalAlpha=1;
  for(const f of fx)rect(f,f.t*10,'#9a9a9a',2,.55*(1-f.t/.7));
  for(const l of layers)box(l);
  for(const f of fx)if(f.t<.35)rect(f,0,'#fff',Math.max(3,S*.45),1-f.t/.35);
  for(const f of fall)box(f,Math.max(0,f.a));
  if(cur)box(cur);

  const m=Math.max(16,W*.04);
  pill(W-m-100,m,100,28);diamond(W-m-88,m+14,10);text(String(diam),W-m-8,m+15,15,300,'right');
  if(pop>0)text('+1 ◊',W-m-30,m+48,13,300,'center',Math.min(1,pop*2));
  const ts=Math.min(H*.09,W*.2);
  if(state==='menu'){
    pill(m,m,70,28);text('★ '+best,m+10,m+15,15,300,'left');
    text('STACK',W/2,H*.16,ts*1.1,200);
    text('TAP TO START',W/2,H*.26,ts*.4,200,'center',.6+.4*Math.sin(performance.now()/300));
  }else{
    text(String(score),W/2,H*.15,ts*1.2,200);
    if(state==='over'){
      text('GAME OVER',W/2,H*.27,ts*.4,300);
      text('BEST '+best,W/2,H*.32,ts*.28,200,'center',.7);
      if(overT>.5)text('TAP TO RESTART',W/2,H*.38,ts*.3,200,'center',.6+.4*Math.sin(performance.now()/300));
    }
  }
}
reset();
let last=performance.now();
(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
